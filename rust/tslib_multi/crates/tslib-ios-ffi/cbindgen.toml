# cbindgen configuration for generating the C header consumed by Swift

language = "C"
include_guard = "TSLIB_IOS_H"
pragma_once = true
cpp_compat = true

header = """
/**
 * tslib-ios-ffi — C bindings for the tslib TeamSpeak 3/6 client library.
 *
 * Threading model:
 *   - tslib_client_connect() spawns a dedicated worker thread that owns the
 *     underlying Client and its Tokio runtime.
 *   - tslib_client_poll_event() returns JSON events (free with tslib_string_free).
 *   - All other client functions marshal a command to the worker thread and
 *     block until it completes.
 *
 * Memory management:
 *   - Returned strings must be freed with tslib_string_free().
 *   - Handles must be freed with the matching tslib_*_free() / tslib_*_destroy().
 */
"""

autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not edit manually. */"

[export]
include = ["TsLibError", "TsLibIdentity", "TsClient", "TsOpus"]

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
rename_args = "snake_case"
sort_by = "None"

[parse]
parse_deps = false
clean = false
