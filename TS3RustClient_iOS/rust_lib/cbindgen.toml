language = "C"
include_guard = "TS3_RUST_H"
pragma_once = true
cpp_compat = true

header = """
/**
 * ts3-rust — C FFI wrapper around ReSpeak/tsclientlib.
 *
 * Threading: connect() spawns a background worker that owns the Tokio runtime
 * and all tsclientlib connections. All exported functions marshal commands to
 * the worker; connect blocks until the connection is established (or fails).
 *
 * Logging: call init_logger() once, then ts3_set_log_callback() to receive
 * Rust log lines as C strings.
 */
"""

autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not edit manually. */"

[export]
include = ["LogCallback", "Ts3AudioCallback", "Ts3TalkCallback"]

[fn]
rename_args = "snake_case"
sort_by = "None"

[parse]
parse_deps = false
clean = false
