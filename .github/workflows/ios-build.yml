name: Build unsigned iOS app

on:
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build TS6.app (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust static library for iOS
        working-directory: rust/tslib_multi
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: cargo build --release --target aarch64-apple-ios -p tslib-ios-ffi

      - name: Copy static library into Xcode project
        run: |
          mkdir -p ios/RustLib
          cp rust/tslib_multi/target/aarch64-apple-ios/release/libtslib_ios_ffi.a \
             ios/RustLib/libtslib_ios_ffi.a

      - name: Build unsigned .app with xcodebuild
        working-directory: ios
        run: |
          xcodebuild \
            -project TS6.xcodeproj \
            -scheme TS6 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and package .ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/TS6.app"
          test -d "$APP" || { echo "App not found at $APP"; exit 1; }
          codesign --force --deep --sign - "$APP"
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP" "Payload/TS6.app"
          ditto -c -k --sequesterRsrc --keepParent Payload TS6-iOS.ipa
          rm -rf Payload
          ditto -c -k --sequesterRsrc --keepParent "$APP" TS6-iOS-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TS6-iOS
          path: |
            ios/TS6-iOS.ipa
            ios/TS6-iOS-app.zip
          if-no-files-found: error
